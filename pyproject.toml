[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jakarta-strain-workflow"
version = "0.1.0"
description = "Public Q8 strain-rate inversion and figure workflow for Jakarta RUM velocities"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "shapely==2.0.6",
  "contextily==1.6.2",
  "pyproj==3.7.0",
  "pillow==11.0.0",
  "requests==2.32.3",
  "ipykernel==6.29.5",
  "jupyterlab==4.3.1",
  "nbclient==0.10.1",
  "nbformat==5.10.4",
]

[tool.setuptools]
py-modules = []
